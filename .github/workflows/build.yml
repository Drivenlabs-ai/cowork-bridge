name: Build & release installer

# Compile l'installeur Inno (.exe) sur un runner Windows.
#  - push main : build + Release GitHub (version par date, checksum SHA256) -> auto-update.
#  - pull_request : build + artefact téléchargeable SEULEMENT (aucune release) -> permet
#    de tester un exe de PR sans l'expédier aux clients.
# (Pas de signature ici : intégrité par checksum ; signature ajoutable plus tard.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # création de la Release

jobs:
  # Garde-fou de syntaxe : le développement se fait sur macOS, la cible est Windows
  # PowerShell 5.1. Ce job est le SEUL endroit où le script est réellement analysé par
  # l'interpréteur cible — et le seul où l'agent résident, qui vit dans un here-string et
  # n'est donc jamais relu par personne, est extrait puis analysé lui aussi.
  # Volontairement SANS `needs` côté release : un défaut de ce garde-fou ne doit pas
  # empêcher la publication d'un correctif. À rendre bloquant après le banc Windows.
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Syntaxe de l'installeur (Windows PowerShell 5.1)
        shell: powershell   # 'powershell' = PS 5.1 sur windows-latest ('pwsh' serait PS 7)
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\Install-CoworkBridge.ps1", [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host ("L{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "Erreurs de syntaxe dans Install-CoworkBridge.ps1"
          }
          Write-Host "Install-CoworkBridge.ps1 : syntaxe OK"

      - name: Encodage UTF-8 avec BOM
        shell: powershell
        run: |
          # Sans BOM, PS 5.1 lit le fichier en ANSI : tous les accents de l'UI cassent.
          $b = [System.IO.File]::ReadAllBytes("$PWD\Install-CoworkBridge.ps1")
          if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
            throw "Install-CoworkBridge.ps1 n'est plus en UTF-8 AVEC BOM"
          }
          Write-Host "BOM UTF-8 present"

      - name: Syntaxe de l'agent resident genere
        shell: powershell
        run: |
          # L'agent est produit par interpolation d'un here-string : ce qui tourne chez le
          # client n'existe nulle part en tant que fichier. On reproduit l'interpolation
          # (littéraux injectés à la génération, puis backtick-$ -> $) et on analyse le résultat.
          $src = [System.IO.File]::ReadAllText("$PWD\Install-CoworkBridge.ps1")
          $m = [regex]::Match($src, '(?s)\$agent = @"\r?\n(.*?)\r?\n"@')
          if (-not $m.Success) { throw "Here-string de l'agent introuvable (le motif a change ?)" }
          $body = $m.Groups[1].Value
          $subs = @{
            'safetyLit' = "'--max-delete', '100'"; 'perfLit' = "'--checkers', '1'"
            'logLit'    = "'--log-level', 'INFO'"; 'rcLit'   = 'C:\app\rclone.exe'
            'metaLit'   = 'C:\work\_bridge';       'markLit' = '.coworkbridge-ok'
            'codeMissingLit' = '90'; 'gateHoursLit' = '24'; 'consecLit' = '2'; 'throttleLit' = '3'
          }
          foreach ($k in $subs.Keys) { $body = $body -replace ('\$' + $k), $subs[$k] }
          $body = $body -replace '`\$', '$'
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($body, [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host ("agent L{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "Erreurs de syntaxe dans l'agent resident genere"
          }
          Write-Host "sync-agent.ps1 (genere) : syntaxe OK"

  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # nécessaire pour compter les commits du jour

      - name: Determine version (date-based)
        id: ver
        shell: bash
        env:
          TZ: UTC   # date ET git log --since dans le même fuseau, déterministe
        run: |
          DATE=$(date +%Y-%m-%d)
          COUNT=$(git log --oneline --since="$DATE 00:00:00" | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then COUNT=1; fi   # au moins 1 (le build courant)
          Y=$((10#$(date +%Y))); M=$((10#$(date +%m))); D=$((10#$(date +%d)))
          V="$Y.$M.$D.$COUNT"
          printf '%s' "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Bundle rclone (MIT, checksum vérifié)
        shell: pwsh
        run: |
          $ver  = '1.74.3'                       # version épinglée (auditée)
          $zip  = "rclone-v$ver-windows-amd64.zip"
          $base = "https://downloads.rclone.org/v$ver"
          Invoke-WebRequest "$base/$zip" -OutFile $zip -UseBasicParsing
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile rclone-SHA256SUMS -UseBasicParsing
          $line = Select-String -Path rclone-SHA256SUMS -SimpleMatch $zip | Select-Object -First 1
          if (-not $line) { throw "Hash introuvable pour $zip dans SHA256SUMS" }
          $expected = ($line.Line -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Checksum rclone invalide: $actual != $expected" }
          Expand-Archive $zip -DestinationPath rclone-extract -Force
          Copy-Item (Get-ChildItem rclone-extract -Recurse -Filter rclone.exe | Select-Object -First 1).FullName -Destination rclone.exe -Force
          # Le zip rclone ne contient PAS la licence -> on récupère COPYING (MIT) depuis
          # le repo au tag exact (obligation MIT : joindre la notice). Build cassé si absente.
          Invoke-WebRequest "https://raw.githubusercontent.com/rclone/rclone/v$ver/COPYING" -OutFile rclone-LICENSE.txt -UseBasicParsing
          if (-not (Test-Path rclone-LICENSE.txt)) { throw "Notice MIT rclone introuvable" }
          Write-Host "rclone $ver bundlé (checksum OK: $actual)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC introuvable : $iscc" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppVersionInfo=${{ steps.ver.outputs.version }}" "setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Échec compilation Inno Setup (code $LASTEXITCODE)" }
          Get-ChildItem Output

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = (Get-ChildItem Output\*.exe | Select-Object -First 1).FullName
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  CoworkBridge-Setup.exe" | Out-File -FilePath Output\CHECKSUM -Encoding ascii -NoNewline
          Write-Host "SHA256: $h"

      - name: Upload artifact (test build)
        uses: actions/upload-artifact@v4
        with:
          name: CoworkBridge-Setup-${{ steps.ver.outputs.version }}
          path: |
            Output/CoworkBridge-Setup.exe
            Output/CHECKSUM
          if-no-files-found: error

      - name: Create or update release
        if: github.event_name == 'push'   # release seulement sur push main, jamais sur PR
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # Idempotent : si le tag existe déjà (re-run / push sans nouveau commit),
          # on met à jour les assets au lieu d'échouer.
          gh release create $tag "Output\CoworkBridge-Setup.exe" "Output\CHECKSUM" "VERSION" `
            --title "Cowork Bridge ${{ steps.ver.outputs.version }}" `
            --notes "Build automatique depuis ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Le tag $tag existe déjà -> mise à jour des assets (--clobber)."
            gh release upload $tag "Output\CoworkBridge-Setup.exe" "Output\CHECKSUM" "VERSION" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Échec publication de la release" }
          }
        env:
          GH_TOKEN: ${{ github.token }}
